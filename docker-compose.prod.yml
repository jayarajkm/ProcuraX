# Production stack: only nginx publishes ports. Postgres/backend/worker live on an internal network.
# Usage: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
name: ${COMPOSE_PROJECT_NAME:-procurax}
x-backend: &backend
  build: ./backend
  image: procurax-backend:${APP_VERSION:-local}
  restart: unless-stopped
  user: "1000:1000"
  env_file: ${ENV_FILE:-.env.prod}
  environment:
    ENVIRONMENT: production
  volumes:
    - uploads:/data/uploads
    - models:/data/models
  networks: [internal]
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env.prod}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]            # NO ports published
  migrate:
    <<: *backend
    restart: "no"
    command: alembic upgrade head
    depends_on:
      postgres: { condition: service_healthy }
  backend:
    <<: *backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips='*'
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 30s
  worker:
    <<: *backend
    command: python -m app.workers.runner
    depends_on:
      migrate: { condition: service_completed_successfully }
  frontend:
    build: ./frontend
    image: procurax-frontend:${APP_VERSION:-local}
    restart: unless-stopped
    networks: [internal]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [backend, frontend]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    networks: [internal]
  certbot:
    image: certbot/certbot:latest
    profiles: ["tls"]
    restart: unless-stopped
    volumes: [certbot-www:/var/www/certbot, letsencrypt:/etc/letsencrypt]
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    networks: [internal]
volumes:
  pgdata:
  uploads:
  models:
  certbot-www:
  letsencrypt:
networks:
  internal:
